<!DOCTYPE html>
<html lang="en-MY">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ember &amp; Oak — Dashboard</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Staff dashboard for Ember & Oak — manage the menu, orders and storefront settings.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css?v=8">
</head>
<body class="admin-body">

  <div class="admin">
    <aside class="sidebar">
      <a class="side-brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21c4.2 0 7-2.9 7-6.7 0-3.4-2.3-5.4-4-7.5C13.5 4.9 12.6 3.3 12.4 1.5c-2.4 1.9-4.3 4.3-4.3 6.8 0 1.6.8 2.7 1.9 3.2.7.3 1.4 0 1.6-.7.2-.7 0-1.5-.4-2.2"/>
            <path d="M8.5 21h7"/>
          </svg>
        </span>
        <span class="side-brand-text">
          <strong id="sideBrandName">Ember &amp; Oak</strong>
          <small>Staff dashboard</small>
        </span>
      </a>

      <nav class="side-nav" aria-label="Dashboard sections">
        <a class="side-link" href="#overview" data-nav="overview">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.6"/><rect x="13" y="3" width="8" height="8" rx="1.6"/><rect x="3" y="13" width="8" height="8" rx="1.6"/><rect x="13" y="13" width="8" height="8" rx="1.6"/></svg>
          Overview
        </a>
        <a class="side-link" href="#menu" data-nav="menu">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 7h12l1.2 14H4.8L6 7Z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>
          Menu items
        </a>
        <a class="side-link" href="#categories" data-nav="categories">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4 12 22 2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.4"/></svg>
          Categories
        </a>
        <a class="side-link" href="#orders" data-nav="orders">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v4a2 2 0 0 0 0 6v4H4v-4a2 2 0 0 0 0-6V5Z"/><path d="M9 9h6M9 13h4"/></svg>
          Orders
          <span class="side-badge" id="sideOrderCount" hidden>0</span>
        </a>
        <a class="side-link" href="#settings" data-nav="settings">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          Settings
        </a>
      </nav>

      <div class="side-foot">
        <a class="side-link storefront-link" href="index.html" target="_blank" rel="noopener">
          View storefront
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>
        </a>
        <p class="side-note">Demo dashboard — data is saved in this browser.</p>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div class="admin-heading">
          <h1 id="pageTitle">Overview</h1>
          <p id="pageSub">A live snapshot of your kitchen.</p>
        </div>
        <div class="admin-actions">
          <span class="status-pill" id="adminStatus"><span class="status-dot"></span>Open now</span>
          <button class="btn btn-dark btn-sm" id="newItemBtn" type="button" hidden>+ New item</button>
        </div>
      </header>

      <div class="admin-view" id="adminView"></div>
    </main>
  </div>

  <script src="assets/js/store.js?v=8"></script>
  <script src="assets/js/ui.js?v=9"></script>
  <script src="assets/js/admin.js?v=9"></script>
</body>
</html>
